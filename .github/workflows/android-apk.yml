name: Build NetPulse Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netpulse-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG="netpulse-v${APP_VERSION}-build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "NetPulse v${APP_VERSION} build ${{ github.run_number }}" \
            --notes "NetPulse Android test APK. Enable Usage Access in Android Settings for daily data totals." \
            --latest=false
